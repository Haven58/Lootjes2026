<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinterklaas lootjes 2026</title>
<meta name="description" content="Trek je lootje en vul je verlanglijstje in.">
<meta property="og:title" content="Sinterklaas lootjes 2026 🎁">
<meta property="og:description" content="Kies je naam, trek je lootje en vul je verlanglijstje in.">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2314213D'/%3E%3Cpath d='M7 20h10l-.8-7.5C15.8 9.2 14.2 6.6 12 5c-2.2 1.6-3.8 4.2-4.2 7.5z' fill='none' stroke='%23E3B25A' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M12 10v6M9.8 13h4.4' stroke='%23E3B25A' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D; --navy-deep:#0E1830; --gold:#E3B25A; --gold-hover:#F0C978;
    --cream:#F4EEDF; --muted-dark:#B7C0D3; --muted:#5A6478; --line:#E6E9F0; --soft:#F3F5F9;
    --link:#9A6A12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy);color:var(--cream);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh}
  button,input{font-family:inherit}
  a{color:var(--gold)}
  .serif{font-family:'Young Serif',Georgia,serif;font-weight:400}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .skyline{position:absolute;left:0;width:100%;pointer-events:none}
  .btn{min-height:58px;width:100%;border:0;border-radius:14px;background:var(--gold);color:var(--navy);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background .15s}
  .btn:hover{background:var(--gold-hover)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn-dark{background:var(--navy);color:var(--cream)}
  .btn-dark:hover{background:#22325A}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:15px;font-weight:500;color:var(--gold);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 20px) 28px 0}

  /* start */
  .names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:24px 28px}
  .name{min-height:54px;padding:0 16px;border-radius:12px;background:#fff;color:var(--navy);font-size:17px;font-weight:500;border:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-align:left;transition:transform .12s}
  .name:active{transform:scale(.97)}
  .tick{width:22px;height:22px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .foot{margin-top:auto;padding:0 28px calc(env(safe-area-inset-bottom) + 28px);display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted-dark)}

  /* trekken */
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes rattle{0%,100%{transform:translateX(0) rotate(0)}10%{transform:translateX(-6px) rotate(-3deg)}20%{transform:translateX(6px) rotate(3deg)}30%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}50%{transform:translateX(-5px) rotate(-2deg)}60%{transform:translateX(5px) rotate(2deg)}80%{transform:translateY(-4px)}}
  @keyframes flapopen{0%{transform:rotateX(0)}100%{transform:rotateX(180deg)}}
  @keyframes rise{0%{transform:translateY(120px) scale(.9);opacity:0}55%{transform:translateY(-14px) scale(1.03);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes twinkle{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(.8) rotate(90deg);opacity:.85}}
  @keyframes fadeup{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .stage{flex-grow:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:320px}
  .env{animation:float 3.2s ease-in-out infinite;cursor:pointer;background:none;border:0;padding:0}
  .env.shaking{animation:rattle 1.1s ease-in-out both}
  .env-box{width:260px;height:172px;position:relative;perspective:600px}
  .env-body{position:absolute;inset:0;border-radius:12px;background:var(--cream);box-shadow:0 20px 40px rgba(0,0,0,.35)}
  .flap{position:absolute;left:0;top:0;width:260px;height:100px;transform-origin:top center}
  .env.shaking .flap{animation:flapopen .5s 1.1s ease-in forwards}
  .seal{position:absolute;left:106px;top:66px;width:48px;height:48px;border-radius:50%;background:#B3261E;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #7E1A14}
  .reveal{position:relative}
  .reveal-card{width:270px;padding:34px 24px;border-radius:18px;background:#fff;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 24px 50px rgba(0,0,0,.4);animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
  .star{position:absolute}
  .actions{padding:0 28px calc(env(safe-area-inset-bottom) + 56px);display:flex;flex-direction:column;gap:12px;position:relative}
  .fadeup{animation:fadeup .5s .8s both}

  /* mijn pagina */
  .page{padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 48px);display:flex;flex-direction:column;gap:16px;color:var(--navy)}
  .card{background:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
  .card h2{margin:0;font-size:24px}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .small{font-size:14px;color:var(--muted)}
  .lootje{background:var(--gold)}
  .inner{background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .wish-line{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:15px;line-height:1.4}
  .wish-line a,.mywish a{color:var(--link);font-weight:700;white-space:nowrap}
  .mywish{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft)}
  .mywish .txt{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
  .mywish a{font-size:14px;font-weight:500}
  .x{width:44px;height:44px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:10px}
  .x:hover{background:#E6E9F0}
  label{font-size:14px;font-weight:700}
  input[type=text],input[type=url]{min-height:48px;width:100%;padding:0 14px;border-radius:12px;border:1px solid #C9CFDB;background:#fff;font-size:16px;color:var(--navy)}
  input::placeholder{color:#7A8396}
  input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  form{display:flex;flex-direction:column;gap:10px;padding-top:6px}
  .info-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
  .info-row:last-child{border-bottom:0}
  .info-row span:first-child{color:var(--muted)}
  .info-row span:last-child{font-weight:700;text-align:right}
  .poem{background:var(--navy);color:var(--cream);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;display:flex;gap:12px;align-items:flex-start}
  .people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 6px}
  .person{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:#3A4458;text-align:center}
  .dot{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .dot.yes{background:var(--gold)}
  .dot.no{border:2px dashed #A9B1C2;color:var(--muted)}
  details{border-bottom:1px solid var(--line)}
  details:last-of-type{border-bottom:0}
  summary{min-height:50px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-size:16px;font-weight:500}
  summary::-webkit-details-marker{display:none}
  summary .chev{transition:transform .2s}
  details[open] summary .chev{transform:rotate(90deg)}
  .dlist{display:flex;flex-direction:column;gap:8px;padding:0 0 14px}
  .empty{font-size:15px;color:var(--muted);font-style:italic}
  .err{background:#FDECEA;color:#8C1C16;border-radius:12px;padding:12px 14px;font-size:15px}
  .loading{flex-grow:1;display:flex;align-items:center;justify-content:center;color:var(--muted-dark);font-size:16px}
  .switch{align-self:center;background:none;border:0;padding:10px 12px;font-size:12px;color:rgba(183,192,211,.55);text-decoration:underline;cursor:pointer}
  .switch:hover{color:var(--muted-dark)}
  #notme{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-delay:0s !important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Even laden…</div></div>

<script>
// ===== Gegevens van pakjesavond — pas hier aan als er iets verandert =====
const EVENT = {
  wanneer: "Zondag 6 december",
  waar: "Ugchelen",
  budget: "€ 30",
  gedicht: "Iedereen maakt een klein gedichtje. Een paar rijmende regels is genoeg, plagen mag!",
};
// =========================================================================

const app = document.getElementById("app");
const STORE_KEY = "lootjes2026-naam";
let state = null;

const ICONS = {
  back: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  tick: '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg class="chev" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  pen: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E3B25A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>',
  gift: '<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M3 13h18M12 9v12"/><path d="M12 9c-1.5-3-5-4-5-1.5S10 9 12 9zm0 0c1.5-3 5-4 5-1.5S14 9 12 9z"/></svg>',
  mitre: '<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4EEDF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21h12l-1-9c-.5-4-2.5-7-5-9-2.5 2-4.5 5-5 9z"/><path d="M12 9v7M9.5 12.5h5"/></svg>',
};
const ROOFS = 'M0 190V150l18-20 18 20v-14l22-26 22 26v40-34l16-18 16 18v-8l24-30 24 30v42-28l14-16 14 16v-6l20-24 20 24v30-36l18-22 18 22v-4l22-28 22 28v40-30l16-18 16 18v-6l24-28 24 28H390V190z';

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function plural(n) { return n === 0 ? "nog leeg" : n === 1 ? "1 wens" : n + " wensen"; }

async function api(path, body) {
  const opts = body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {};
  const res = await fetch("/api/" + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Er ging iets mis");
  return data;
}

function currentName() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  return h || null;
}
function go(name) {
  location.hash = name ? "#/" + encodeURIComponent(name) : "#/";
}

async function load(me) {
  state = await api("state" + (me ? "?me=" + encodeURIComponent(me) : ""));
  return state;
}

// ---------- Schermen ----------

function renderStart() {
  const drawn = new Set(state.drawn);
  app.innerHTML = `
    <svg class="skyline" style="top:0" aria-hidden="true" viewBox="0 0 390 190" preserveAspectRatio="xMidYMax slice" height="190">
      <circle cx="300" cy="46" r="22" fill="#F4EEDF" opacity=".9"/><circle cx="309" cy="40" r="20" fill="#14213D"/>
      <circle cx="40" cy="30" r="2" fill="#E3B25A"/><circle cx="120" cy="58" r="1.6" fill="#F4EEDF"/><circle cx="200" cy="24" r="2.2" fill="#E3B25A"/><circle cx="250" cy="90" r="1.4" fill="#F4EEDF"/><circle cx="355" cy="98" r="2" fill="#E3B25A"/><circle cx="80" cy="96" r="1.4" fill="#F4EEDF"/>
      <path d="${ROOFS}" fill="#0E1830"/>
      <rect x="58" y="150" width="8" height="10" fill="#E3B25A" opacity=".7"/><rect x="170" y="148" width="8" height="10" fill="#E3B25A" opacity=".5"/><rect x="292" y="152" width="8" height="10" fill="#E3B25A" opacity=".7"/>
    </svg>
    <div style="padding:200px 28px 0;display:flex;flex-direction:column;gap:10px;position:relative">
      <span class="eyebrow">Lootjes 2026</span>
      <h1 class="serif" style="margin:0;font-size:40px;line-height:1.05">Wie ben jij?</h1>
      <p style="margin:0;font-size:16px;line-height:1.5;color:var(--muted-dark)">Tik op je naam. Dan trek je je lootje en vul je je verlanglijstje.</p>
    </div>
    <div class="names">
      ${state.names.map((n) => `
        <button class="name" type="button" data-name="${esc(n)}">
          <span>${esc(n)}</span>
          ${drawn.has(n) ? `<span class="tick" role="img" aria-label="heeft al getrokken">${ICONS.tick}</span>` : ""}
        </button>`).join("")}
    </div>
    <div class="foot">
      <span>${esc(EVENT.wanneer)} · ${esc(EVENT.waar)}</span>
      <span style="white-space:nowrap">${state.drawn.length}/${state.names.length} getrokken</span>
    </div>`;
  app.querySelectorAll(".name").forEach((b) => b.addEventListener("click", () => {
    try { localStorage.setItem(STORE_KEY, b.dataset.name); } catch {}
    go(b.dataset.name);
  }));
}

function notMe() {
  location.hash = "#/wissel";
}

function renderSwitch() {
  let saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch {}
  app.innerHTML = `
    <div class="topbar" style="position:relative">
      <span class="eyebrow">Lootjes 2026</span>
    </div>
    <form id="switchform" novalidate style="padding:40px 28px 0;display:flex;flex-direction:column;gap:12px;position:relative">
      <h1 class="serif" style="margin:0 0 4px;font-size:36px;line-height:1.1">Wie ben jij?</h1>
      <label for="who" style="font-weight:400;font-size:16px;line-height:1.5;color:var(--muted-dark)">Typ je voornaam om naar je eigen pagina te gaan.</label>
      <input id="who" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Je voornaam">
      <div id="whomsg"></div>
      <button class="btn" type="submit">Verder</button>
      ${saved ? `<button class="switch" type="button" id="cancel">Terug naar ${esc(saved)}</button>` : ""}
    </form>`;
  const input = document.getElementById("who");
  input.focus();
  document.getElementById("switchform").addEventListener("submit", (e) => {
    e.preventDefault();
    const typed = input.value.trim().toLowerCase();
    const match = state && state.names.find((n) => n.toLowerCase() === typed);
    if (!match) {
      document.getElementById("whomsg").innerHTML = `<div class="err">Die naam kennen we niet. Check even de spelling.</div>`;
      input.select();
      return;
    }
    try { localStorage.setItem(STORE_KEY, match); } catch {}
    go(match);
  });
  const c = document.getElementById("cancel");
  if (c) c.onclick = () => go(saved);
}

function renderDraw(me) {
  app.innerHTML = `
    <svg class="skyline" style="bottom:0" aria-hidden="true" viewBox="0 60 390 130" preserveAspectRatio="xMidYMax slice" height="120"><path d="${ROOFS}" fill="#0E1830"/></svg>
    <div class="topbar" style="position:relative">
      <span class="eyebrow">Lootjes 2026</span>
    </div>
    <div style="padding:24px 28px 0;display:flex;flex-direction:column;gap:8px;position:relative">
      <h1 class="serif" style="margin:0;font-size:36px;line-height:1.1">Dag ${esc(me)}</h1>
      <p id="sub" style="margin:0;font-size:16px;line-height:1.5;color:var(--muted-dark)">Er is post voor je, vannacht door de schoorsteen gekomen.</p>
    </div>
    <div class="stage" id="stage">
      <button class="env" type="button" id="env" aria-label="Open je lootje">
        <div class="env-box">
          <div class="env-body"></div>
          <svg aria-hidden="true" width="260" height="172" viewBox="0 0 260 172" style="position:absolute;inset:0"><path d="M0 172L130 86 260 172" fill="none" stroke="#D8CDB6" stroke-width="2"/></svg>
          <div class="flap"><svg aria-hidden="true" width="260" height="100" viewBox="0 0 260 100"><path d="M6 0h248L130 96z" fill="#E9DFC9" stroke="#D8CDB6" stroke-width="2" stroke-linejoin="round"/></svg></div>
          <div class="seal">${ICONS.mitre}</div>
        </div>
      </button>
    </div>
    <div class="actions" id="actions">
      <div id="msg"></div>
      <button class="btn" type="button" id="draw">Open je lootje</button>
      <button class="switch" type="button" id="notme">Niet ${esc(me)}?</button>
    </div>`;
  document.getElementById("notme").onclick = notMe;
  const start = async () => {
    const btn = document.getElementById("draw");
    if (btn.disabled) return;
    btn.disabled = true;
    document.getElementById("env").classList.add("shaking");
    const wait = new Promise((r) => setTimeout(r, 1700));
    try {
      const [res] = await Promise.all([api("draw", { me }), wait]);
      state.iDrew = true;
      state.target = res.target;
      if (!state.drawn.includes(me)) state.drawn.push(me);
      showReveal(me, res.target);
    } catch (e) {
      document.getElementById("env").classList.remove("shaking");
      document.getElementById("msg").innerHTML = `<div class="err">${esc(e.message)}. Probeer het nog eens.</div>`;
      btn.disabled = false;
    }
  };
  document.getElementById("draw").onclick = start;
  document.getElementById("env").onclick = start;
}

function showReveal(me, target) {
  const pos = [[-30,-20,22],[250,-34,18],[285,60,26],[-40,110,16],[120,-56,14],[240,190,20],[10,210,14],[-18,40,12]];
  document.getElementById("sub").textContent = "Dit blijft tussen jou en de Sint.";
  document.getElementById("stage").innerHTML = `
    <div class="reveal">
      ${pos.map((p, i) => `<svg class="star" aria-hidden="true" width="${p[2]}" height="${p[2]}" viewBox="0 0 24 24" style="left:${p[0]}px;top:${p[1]}px;animation:twinkle .8s ${(0.4 + i * 0.12).toFixed(2)}s ease-out both"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#E3B25A"/></svg>`).join("")}
      <div class="reveal-card" role="status">
        <span style="font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">Jij hebt</span>
        <span class="serif" style="font-size:56px;line-height:1;overflow-wrap:anywhere">${esc(target)}</span>
        <div style="width:60px;height:3px;border-radius:3px;background:var(--gold)"></div>
        <span style="font-size:15px;color:var(--muted)">Cadeautjes, gedichtjes en pepernoten: het gezellige avondje komt eraan!.</span>
      </div>
    </div>`;
  document.getElementById("actions").innerHTML = `
    <div class="fadeup" style="display:flex;flex-direction:column;gap:12px">
      <button class="btn" type="button" id="topage">Naar mijn pagina</button>
    </div>`;
  document.getElementById("topage").onclick = () => renderPage(me);
}

function wishLine(w) {
  return `<div class="wish-line"><span style="overflow-wrap:anywhere">${esc(w.d)}</span>${w.l ? `<a href="${esc(w.l)}" target="_blank" rel="noopener noreferrer">Bekijk</a>` : ""}</div>`;
}

function renderPage(me) {
  const t = state.target;
  const tw = state.wishes[t] || [];
  const mine = state.wishes[me] || [];
  const drawn = new Set(state.drawn);
  const others = state.names.filter((n) => n !== me);
  const openKeys = new Set([...app.querySelectorAll("details[open]")].map((d) => d.dataset.n));

  app.innerHTML = `
    <div class="page">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:var(--cream)">
        <div style="display:flex;flex-direction:column;gap:2px">
          <span class="eyebrow">Lootjes 2026</span>
          <h1 class="serif" style="margin:0;font-size:32px;line-height:1.1">Dag ${esc(me)}</h1>
        </div>
      </div>

      <section class="card lootje" aria-labelledby="h-lootje">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;flex-direction:column;gap:4px">
            <span id="h-lootje" style="font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#3A3320">Jouw lootje</span>
            <span class="serif" style="font-size:44px;line-height:1;overflow-wrap:anywhere">${esc(t)}</span>
          </div>
          ${ICONS.gift}
        </div>
        <div class="inner">
          <span style="font-size:14px;font-weight:700">Verlanglijstje van ${esc(t)}</span>
          ${tw.length ? tw.map(wishLine).join("") : `<span class="empty">${esc(t)} heeft nog niets ingevuld. Kijk later nog eens!</span>`}
        </div>
      </section>

      <section class="card" aria-labelledby="h-mine">
        <div class="row"><h2 id="h-mine" class="serif">Mijn verlanglijstje</h2><span class="small">${plural(mine.length)}</span></div>
        ${mine.map((w) => `
          <div class="mywish">
            <div class="txt"><span>${esc(w.d)}</span>${w.l ? `<a href="${esc(w.l)}" target="_blank" rel="noopener noreferrer">Link bekijken</a>` : ""}</div>
            <button class="x" type="button" data-del="${esc(w.id)}" aria-label="Verwijder ${esc(w.d)}">${ICONS.x}</button>
          </div>`).join("")}
        <form id="wishform" novalidate>
          <label for="desc">Nieuwe wens</label>
          <input id="desc" type="text" maxlength="200" autocomplete="off" placeholder="Bijv. een warme sjaal, donkergroen" required>
          <label for="link">Link <span style="font-weight:400;color:var(--muted)">(optioneel)</span></label>
          <input id="link" type="url" inputmode="url" maxlength="500" autocomplete="off" placeholder="https://">
          <div id="formmsg"></div>
          <button class="btn btn-dark" type="submit" id="addbtn">Wens toevoegen</button>
        </form>
      </section>

      <section class="card" aria-labelledby="h-info">
        <h2 id="h-info" class="serif">Pakjesavond</h2>
        <div>
          <div class="info-row"><span>Wanneer</span><span>${esc(EVENT.wanneer)}</span></div>
          <div class="info-row"><span>Waar</span><span>${esc(EVENT.waar)}</span></div>
          <div class="info-row"><span>Budget</span><span>${esc(EVENT.budget)}</span></div>
        </div>
        <div class="poem">${ICONS.pen}<span>${esc(EVENT.gedicht)}</span></div>
      </section>

      <section class="card" aria-labelledby="h-drawn">
        <div class="row"><h2 id="h-drawn" class="serif">Wie heeft getrokken?</h2><span class="small">${state.drawn.length} van ${state.names.length}</span></div>
        <div class="people">
          ${state.names.map((n) => `
            <div class="person">
              <div class="dot ${drawn.has(n) ? "yes" : "no"}" aria-hidden="true">${esc(n.charAt(0))}</div>
              <span>${esc(n)}<span class="sr">${drawn.has(n) ? " heeft getrokken" : " nog niet"}</span></span>
            </div>`).join("")}
        </div>
        <span class="small" style="font-size:13px">Goud = getrokken · gestippeld = nog niet</span>
      </section>

      <section class="card" aria-labelledby="h-all" style="gap:4px">
        <h2 id="h-all" class="serif" style="margin-bottom:8px">Alle verlanglijstjes</h2>
        ${others.map((n) => {
          const ws = state.wishes[n] || [];
          return `<details data-n="${esc(n)}" ${openKeys.has(n) ? "open" : ""}>
            <summary><span>${esc(n)}</span><span class="small" style="display:flex;align-items:center;gap:6px">${plural(ws.length)} ${ICONS.chev}</span></summary>
            <div class="dlist">${ws.length ? ws.map(wishLine).join("") : `<span class="empty">Nog niets ingevuld.</span>`}</div>
          </details>`;
        }).join("")}
      </section>
      <button class="switch" type="button" id="notme">Niet ${esc(me)}?</button>
    </div>`;

  document.getElementById("notme").onclick = notMe;

  document.getElementById("wishform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = document.getElementById("desc").value.trim();
    const l = document.getElementById("link").value.trim();
    const msg = document.getElementById("formmsg");
    if (!d) { msg.innerHTML = `<div class="err">Vul eerst een beschrijving in.</div>`; document.getElementById("desc").focus(); return; }
    const btn = document.getElementById("addbtn");
    btn.disabled = true; btn.textContent = "Bezig…";
    try {
      const res = await api("wish", { me, d, l });
      state.wishes[me] = res.wishes;
      renderPage(me);
      document.getElementById("desc").focus();
    } catch (err) {
      msg.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = "Wens toevoegen";
    }
  });

  app.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const res = await api("wish/delete", { me, id: b.dataset.del });
      state.wishes[me] = res.wishes;
      renderPage(me);
    } catch (err) { b.disabled = false; alertBox(err.message); }
  }));
}

function alertBox(text) {
  const m = document.getElementById("formmsg");
  if (m) m.innerHTML = `<div class="err">${esc(text)}</div>`;
}

function renderError(text) {
  app.innerHTML = `<div class="page" style="color:var(--cream)"><span class="eyebrow">Lootjes 2026</span>
    <div class="err">${esc(text)}</div>
    <button class="btn" type="button" id="retry">Opnieuw proberen</button></div>`;
  document.getElementById("retry").onclick = route;
}

// ---------- Router ----------
async function route() {
  let me = currentName();
  if (me === "wissel") {
    try { if (!state) await load(null); } catch { renderError("Kon de gegevens niet ophalen. Check je internet en probeer het opnieuw."); return; }
    window.scrollTo(0, 0);
    renderSwitch();
    return;
  }
  if (!me) {
    let saved = null;
    try { saved = localStorage.getItem(STORE_KEY); } catch {}
    if (saved) { go(saved); return; }
  }
  try {
    await load(me);
  } catch (e) {
    renderError("Kon de gegevens niet ophalen. Check je internet en probeer het opnieuw.");
    return;
  }
  if (me && !state.me) { try { localStorage.removeItem(STORE_KEY); } catch {} go(null); return; } // onbekende naam in de link
  window.scrollTo(0, 0);
  if (!me) renderStart();
  else if (!state.iDrew) renderDraw(state.me);
  else renderPage(state.me);
}

window.addEventListener("hashchange", route);
// Ververs de gegevens als iemand terugkomt naar het tabblad (bijv. vanuit WhatsApp)
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !state || !state.me || !state.iDrew) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  try { await load(state.me); renderPage(state.me); } catch {}
});
route();
</script>
</body>
</html>
